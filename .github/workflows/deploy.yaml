name: Deploy MultiDocker
on:
  push:
    branches:
      - main # check your repo, your default branch might be master!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
      - run: docker build -t 093620/react-test -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true 093620/react-test npm test

      - run: docker build -t 093620/multi-client ./client
      - run: docker build -t 093620/multi-nginx ./nginx
      - run: docker build -t 093620/multi-server ./server
      - run: docker build -t 093620/multi-worker ./worker

      - run: docker push 093620/multi-client
      - run: docker push 093620/multi-nginx
      - run: docker push 093620/multi-server
      - run: docker push 093620/multi-worker

      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*' -x '*node_modules*' -x '*.DS_Store*' -x '*.idea*'

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: multi-docker
          environment_name: Multi-docker-env
          existing_bucket_name: elasticbeanstalk-ap-southeast-2-203342792317
          region: ap-southeast-2
          version_label: ${{ github.sha }}-${{ github.run_id }}
          deployment_package: deploy.zip
          wait_for_deployment: true
